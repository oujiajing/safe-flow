spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:demo_safeteam;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

pingan:
  jwt:
    issuer: safeteam-portfolio-test
    secret: safeteam-portfolio-test-secret-at-least-32-bytes
    ttl-minutes: 60
  storage:
    provider: local
    root-dir: ${java.io.tmpdir}/safeteam-portfolio-test-uploads


