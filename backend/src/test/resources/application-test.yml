spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:pingan_banzu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

pingan:
  jwt:
    issuer: pingan-banzu-test
    secret: pingan-banzu-test-secret-at-least-32-bytes
    ttl-minutes: 60
  storage:
    provider: local
    root-dir: ${java.io.tmpdir}/pingan-banzu-test-uploads
