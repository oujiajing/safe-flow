server:
  port: 8080

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,pinganStorage
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: safeteam-portfolio-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${PINGAN_DB_URL:jdbc:postgresql://localhost:5432/demo_safeteam}
    username: ${PINGAN_DB_USERNAME:YOUR_DB_USERNAME_HERE}
    password: ${PINGAN_DB_PASSWORD:YOUR_DB_PASSWORD_HERE}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      max-file-size: ${PINGAN_MULTIPART_MAX_FILE_SIZE:200MB}
      max-request-size: ${PINGAN_MULTIPART_MAX_REQUEST_SIZE:210MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

pingan:
  jwt:
    issuer: safeteam-portfolio
    secret: ${PINGAN_JWT_SECRET:YOUR_JWT_SECRET_HERE}
    ttl-minutes: 720
  storage:
    provider: ${PINGAN_STORAGE_PROVIDER:minio}
    root-dir: ${PINGAN_STORAGE_ROOT:./uploads}
    endpoint: ${PINGAN_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${PINGAN_MINIO_PUBLIC_ENDPOINT:}
    bucket: ${PINGAN_MINIO_BUCKET:demo-safeteam}
    access-key: ${PINGAN_MINIO_ACCESS_KEY:YOUR_MINIO_ACCESS_KEY_HERE}
    secret-key: ${PINGAN_MINIO_SECRET_KEY:YOUR_MINIO_SECRET_KEY_HERE}
    region: ${PINGAN_MINIO_REGION:us-east-1}
    presigned-url-minutes: ${PINGAN_MINIO_PRESIGNED_URL_MINUTES:15}
  security:
    max-failed-login-attempts: 5
    lock-minutes: 30
    two-factor-enabled: false
    test-verification-code: ${PINGAN_TEST_VERIFICATION_CODE:}


