spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${PINGAN_DB_URL:jdbc:postgresql://localhost:15433/pingan_banzu_verify}
    username: ${PINGAN_DB_USERNAME:pingan}
    password: ${PINGAN_DB_PASSWORD:pingan}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

pingan:
  storage:
    provider: ${PINGAN_STORAGE_PROVIDER:local}
    root-dir: ./uploads-local
    endpoint: ${PINGAN_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${PINGAN_MINIO_PUBLIC_ENDPOINT:}
    bucket: ${PINGAN_MINIO_BUCKET:pingan-banzu}
    access-key: ${PINGAN_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${PINGAN_MINIO_SECRET_KEY:minioadmin}
    region: ${PINGAN_MINIO_REGION:us-east-1}
    presigned-url-minutes: ${PINGAN_MINIO_PRESIGNED_URL_MINUTES:15}
