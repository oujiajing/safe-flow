name: safeteam-portfolio-demo

services:
  postgres:
    image: ${POSTGRES_IMAGE:-registry-1.docker.io/pgvector/pgvector:pg16}
    container_name: safeteam-portfolio-demo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_demo}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_demo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YOUR_DB_PASSWORD_HERE}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-15434}:5432"
    volumes:
      - portfolio-demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    container_name: safeteam-portfolio-demo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-YOUR_MINIO_ACCESS_KEY_HERE}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-YOUR_MINIO_SECRET_KEY_HERE}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - portfolio-demo-minio-data:/data

volumes:
  portfolio-demo-postgres-data:
  portfolio-demo-minio-data:
